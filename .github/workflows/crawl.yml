name: Crawl HLS and FLV

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install crawler dependencies
        run: |
          pip install requests playwright
          playwright install --with-deps chromium
      - name: Test crawler and source configuration
        run: python -m unittest discover -s tests -v

      - name: Crawl all configured sources
        run: python -u crawler.py --max-pages 0 --workers 12
      - name: Commit playlist safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep the newly generated playlist while refreshing all other files from origin.
          cp playlist.m3u /tmp/playlist.m3u
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/playlist.m3u playlist.m3u
            git add playlist.m3u
            if git diff --cached --quiet; then
              echo "Playlist không thay đổi; không cần commit."
              exit 0
            fi
            git commit -m "Update crawled HLS and FLV playlist"
            if git push origin HEAD:main; then
              echo "Push playlist thành công."
              exit 0
            fi
            echo "Push lần $attempt thất bại; sẽ fetch lại và thử lần nữa."
          done
          echo "Không thể push playlist sau 3 lần thử."
          exit 1
